# ============================================================
# RAG Production — central configuration
# All parameters live here. Nothing is hardcoded in source.
# ============================================================

app:
  title: "RAG Production API"
  version: "0.1.0"
  debug: false

# ------------------------------------------------------------
# Qdrant vector database
# ------------------------------------------------------------
qdrant:
  host: "localhost"
  port: 6333
  grpc_port: 6334
  collection_prefix: "user_"         # collection name = user_{user_id}
  vector_size: 384                    # all-MiniLM-L6-v2 output dim
  distance: "Cosine"
  timeout_seconds: 10

# ------------------------------------------------------------
# Embedding model
# ------------------------------------------------------------
embedding:
  model_name: "all-MiniLM-L6-v2"
  device: "mps"                       # M1 — change to "cuda" or "cpu" elsewhere
  num_workers: 0                      # required on M1 MPS
  batch_size: 64

# ------------------------------------------------------------
# Chunking (ingestion pipeline)
# ------------------------------------------------------------
chunking:
  chunk_size: 512                     # tokens per chunk
  chunk_overlap: 64
  separators: ["\n\n", "\n", ". ", " "]

# ------------------------------------------------------------
# Retrieval
# ------------------------------------------------------------
retrieval:
  strategy: "similarity"              # "similarity" | "mmr" | "hyde"
  top_k: 10                           # candidates fetched from Qdrant
  top_k_rerank: 4                     # chunks passed to LLM after reranking
  mmr_lambda: 0.5                     # diversity vs relevance balance (MMR)
  score_threshold: 0.4                # minimum cosine score to include a chunk

# ------------------------------------------------------------
# Reranker (cross-encoder)
# ------------------------------------------------------------
reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  device: "mps"
  max_length: 512

# ------------------------------------------------------------
# LLM service
# SWAP COMMENT: to switch from Ollama to OpenAI, change
# provider to "openai" and set api_key via environment variable.
# LangChain makes this a one-line change in llm_service.py.
# ------------------------------------------------------------
llm:
  provider: "ollama"                  # "ollama" | "openai" | "anthropic"
  model: "mistral"
  base_url: "http://localhost:11434"
  temperature: 0.1
  max_tokens: 1024
  request_timeout: 60

# ------------------------------------------------------------
# Query rewriting
# ------------------------------------------------------------
query_rewriter:
  enabled: true
  model: "mistral"                    # same Ollama model — no extra cost

# ------------------------------------------------------------
# SQLite metadata DB
# ------------------------------------------------------------
database:
  path: "./data/metadata.db"

# ------------------------------------------------------------
# Background worker (Celery + Redis)
# ------------------------------------------------------------
worker:
  broker_url: "redis://localhost:6379/0"
  result_backend: "redis://localhost:6379/1"
  task_time_limit: 600                # 10 min hard limit per ingestion task
  task_soft_time_limit: 540

# ------------------------------------------------------------
# FastAPI server
# ------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8000
  workers: 1                          # stateless — safe to scale horizontally

# ------------------------------------------------------------
# RAGAS evaluation
# ------------------------------------------------------------
ragas:
  test_dataset_path: "./eval/test_questions.json"
  metrics: ["faithfulness", "answer_relevancy", "context_precision"]
  output_path: "./eval/results.json"