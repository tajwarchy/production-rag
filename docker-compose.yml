version: "3.9"

services:

  # ----------------------------------------------------------
  # Qdrant vector database
  # Web UI:  http://localhost:6333/dashboard
  # gRPC:    localhost:6334
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.4
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # REST + Web UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Redis — Celery broker + result backend (added here so
  # the ingestion worker can use it from Phase 3 onward)
  # ----------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_storage:   # named volume — survives container restarts