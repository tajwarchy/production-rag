services:

  # ----------------------------------------------------------
  # Qdrant vector database
  # Web UI:  http://localhost:6333/dashboard
  # gRPC:    localhost:6334
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.4
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Redis — Celery broker + result backend
  # ----------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------
  # FastAPI — stateless query + ingest API
  #
  # Stateless design note:
  #   No session state is stored in this container. Every request
  #   reads from Qdrant (vectors) and SQLite (metadata). This means
  #   you can run multiple replicas of this service behind a load
  #   balancer with zero coordination between instances.
  #   Horizontal scaling = add more replicas. No sticky sessions needed.
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rag-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data       # SQLite metadata db
      - ./logs:/app/logs       # loguru log files
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Celery ingestion worker — background PDF processing
  #
  # Worker isolation note:
  #   The worker runs as a completely separate process from the API.
  #   A crash or slowdown during ingestion (heavy embedding work)
  #   cannot affect query latency. This is the core reason ingestion
  #   is a background worker and not an API handler.
  # ----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rag-worker
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker.celery_app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  qdrant_storage: