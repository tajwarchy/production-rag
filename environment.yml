name: rag-prod
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # LangChain ecosystem
      - langchain==0.2.16
      - langchain-community==0.2.16
      - langchain-core==0.2.38

      # Vector DB
      - qdrant-client==1.11.1

      # LLM (local)
      - ollama==0.3.3

      # Embeddings
      - sentence-transformers==3.1.1

      # RAG evaluation
      - ragas==0.1.21

      # API layer
      - fastapi==0.115.0
      - uvicorn[standard]==0.30.6

      # Document parsing
      - pymupdf==1.24.10

      # Reranking (cross-encoder, runs on MPS)
      - transformers==4.44.2

      # Data / config
      - pydantic==2.9.2
      - pydantic-settings==2.5.2
      - pyyaml==6.0.2
      - python-multipart==0.0.9

      # DB
      - aiosqlite==0.20.0

      # Async background tasks
      - celery==5.4.0
      - redis==5.0.8

      # Utilities
      - httpx==0.27.2
      - tenacity==8.3.0
      - loguru==0.7.2
      - datasets==2.21.0